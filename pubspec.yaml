Name: manga_ps
description: "تطبيق Manga PS لإدارة الأجهزة والحسابات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# 👈 إعدادات توليد الأيقونة للأندرويد فقط
flutter_launcher_icons:
  android: true
  ios: false # 👈 خلّي دي false عشان متضربش في الـ Build
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/bg.jpg
