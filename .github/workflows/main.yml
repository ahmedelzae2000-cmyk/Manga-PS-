name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Re-generate Android Project
        run: flutter create . --platforms=android --project-name=manga_ps --org=com.mangaps

      - name: Setup Firebase Config & Gradle Cleanly
        run: |
          mkdir -p android/app
          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json is in android/app"
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.google.gms:google-services:4.4.0' } }" >> android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
