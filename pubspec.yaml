name: manga_ps
description: "Manga PS App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  firebase_core: ^2.24.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/bg.jpg
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: false 
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
